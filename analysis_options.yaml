# AURA · static analysis configuration
# very_good_analysis ships a strict preset; we layer Aura-specific rules on top.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore   # freezed emits this; benign
    missing_required_param: error
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "lib/core/l10n/generated/**"
    - "build/**"
  plugins:
    - custom_lint

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_constructors_first: true
    use_super_parameters: true
    public_member_api_docs: false
    diagnostic_describe_all_properties: false
    lines_longer_than_80_chars: false
    # We group pubspec by purpose, not alphabetically — easier to scan.
    sort_pub_dependencies: false
