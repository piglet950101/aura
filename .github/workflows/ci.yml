name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same branch when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      # `flutter pub get` regenerates lib/l10n/app_l10n*.dart from the ARB
      # files using gen-l10n's own wrap rules — which don't satisfy our
      # --line-length=100 contract. Auto-format that one directory before
      # the strict check so committed-vs-regenerated drift can't fail CI.
      # The check below still catches hand-written drift everywhere else.
      - name: dart format gen-l10n output
        run: dart format --line-length=100 lib/l10n/

      - name: dart format (check)
        run: dart format --output=none --set-exit-if-changed --line-length=100 .

      - name: flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: flutter test
        run: flutter test --coverage --reporter=expanded
        # No tests yet — this becomes meaningful from Day 2.
        continue-on-error: true

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug APK (smoke test)
        # We use a stand-in env file so --dart-define-from-file resolves; real
        # secrets never live in the repo. Production builds use a different
        # workflow that pulls secrets from GitHub Actions secrets.
        run: |
          cp env.example.json env.json
          flutter build apk --debug --dart-define-from-file=env.json
